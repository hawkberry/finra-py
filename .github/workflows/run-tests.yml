name: tests

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  test:
    name: unittest

    strategy:
      fail-fast: false

      matrix:
        platform:
          - windows-latest
          - ubuntu-latest
          - macos-latest

        python:
          - version: "3.11"
            toxenv: py311

          - version: "3.12"
            toxenv: py312

          - version: "3.13"
            toxenv: py313

          - version: "3.14"
            toxenv: py314

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python.version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python.version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/tox.txt

      - name: Test with tox ${{ matrix.python.toxenv }}
        env:
          TOXENV: ${{ matrix.python.toxenv }}
        run: tox

      - name: Upload coverage data
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.platform }}-${{ matrix.python.version }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error

  quality:
    name: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/tox.txt

      - name: Run Ruff
        run: tox -e ruff

      - name: Run mypy
        run: tox -e mypy

  coverage:
    name: coverage
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/tox.txt

      - name: Download coverage data
        uses: actions/download-artifact@v6
        with:
          pattern: coverage-*
          path: .
          merge-multiple: true

      - name: Build coverage report
        run: tox -e coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: GitHub

  readthedocs-test:
    name: readthedocs-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
        	python -m pip install --upgrade pip
        	python -m pip install -r requirements/docs.txt
        	python -m pip install .

      - name: Verify that documentation builds
        run: sphinx-build -W docs/ docs-build

