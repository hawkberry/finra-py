[build-system]
requires = ["setuptools>=68.1.2"]
build-backend = "setuptools.build_meta"

[project]
name = "finra-py"
version = "1.2.0"
authors = [
	{name = "Hawk Berry", email = "finra@hawkberry.com"},
	]
description = "An Unofficial, Open-Source Python Client Library for the FINRA API Platform"
readme = "README.rst"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
	]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
	"finra", "finra-api", "api-client", "rest-api", "market-data", "compliance", "regulatory", "regtech", "broker-dealer", "trading", "fixed-income", "short-interest", "trace",
	]
dependencies = [
    "authlib",
    "httpx",
    "jsonschema",
    "tzdata",
	]

[project.urls]
Documentation = "https://finra.hawkberry.com/en/latest/"
Repository = "https://github.com/hawkberry/finra-py"
Issues = "https://github.com/hawkberry/finra-py/issues"
Changelog = "https://github.com/hawkberry/finra-py/blob/main/CHANGELOG.md"
ADRs = "https://finra.hawkberry.com/en/latest/adr.html"
Consulting = "https://finra.hawkberry.com/en/latest/consulting.html"
Support = "https://support.hawkberry.com/"

[tool.coverage.paths]
source = [
    "finra",
    "*/finra",
    "*\\finra",
	]

[tool.coverage.report]
exclude_lines = [
	"pragma: no cover",
	"raise NotImplementedError",
	]

[tool.coverage.run]
branch = true

[tool.finra-py]
license_url = "https://github.com/hawkberry/finra-py/blob/main/LICENSE"
pypi_url = "https://pypi.org/project/finra-py/"

[[tool.mypy.overrides]]
module = "referencing"
ignore_errors = true

[tool.setuptools.packages.find]
where = ["."]
include = [
	"finra",
	"finra.filings",
	]

